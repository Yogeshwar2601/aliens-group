x-backend-environment: &backend-environment
  env_file:
    - .env
  restart: unless-stopped

services:
  database-migrate:
    build:
      context: ./database-migrations
    env_file:
      - .env
    restart: "no"

  project-service:
    <<: *backend-environment
    build:
      context: ./project-service
    environment:
      PROJECTS_SERVICE_PORT: 5101
      SERVICE_HOST: 0.0.0.0
    ports:
      - "5101:5101"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  blog-service:
    <<: *backend-environment
    build:
      context: ./blog-service
    environment:
      BLOGS_SERVICE_PORT: 5102
      SERVICE_HOST: 0.0.0.0
    ports:
      - "5102:5102"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  construction-service:
    <<: *backend-environment
    build:
      context: ./construction-service
    environment:
      CONSTRUCTION_SERVICE_PORT: 5103
      SERVICE_HOST: 0.0.0.0
    ports:
      - "5103:5103"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  lead-service:
    <<: *backend-environment
    build:
      context: ./lead-service
    environment:
      LEADS_SERVICE_PORT: 5104
      SERVICE_HOST: 0.0.0.0
    ports:
      - "5104:5104"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5104/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api-gateway:
    <<: *backend-environment
    build:
      context: ./api-gateway
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      PROJECTS_SERVICE_URL: http://project-service:5101
      BLOGS_SERVICE_URL: http://blog-service:5102
      CONSTRUCTION_SERVICE_URL: http://construction-service:5103
      LEADS_SERVICE_URL: http://lead-service:5104
    ports:
      - "5000:5000"
    depends_on:
      project-service:
        condition: service_healthy
      blog-service:
        condition: service_healthy
      construction-service:
        condition: service_healthy
      lead-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
